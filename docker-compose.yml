services:
  app:
    image: ${IMAGE_NAME:-next_hono_admin_service}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-app}
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      - TZ=Asia/Shanghai
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
